<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Calc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --paper: #f4f7fc; --grid: #dde5f2; --ink: #17223b; --muted: #5d6b86;
    --blue: #2f5bea; --amber: #e39b12; --card: #ffffff; --line: #cfd8e8; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "DM Sans", system-ui, sans-serif; color: var(--ink);
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px; line-height: 1.6;
  }
  main { max-width: 820px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 {
    font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
    font-size: clamp(2.6rem, 8vw, 4.2rem); line-height: 1; margin: 0 0 12px; letter-spacing: -0.02em;
  }
  .lede { font-size: 1.1rem; color: var(--muted); max-width: 52ch; margin: 0 0 32px; }

  .ask {
    display: flex; gap: 10px; flex-wrap: wrap; background: var(--card);
    border: 1.5px solid var(--ink); border-radius: 14px; padding: 8px; box-shadow: 4px 4px 0 var(--ink);
  }
  .ask input {
    flex: 1 1 240px; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 1.05rem; padding: 12px; color: var(--ink);
  }
  .ask button {
    font: inherit; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff;
    border: 0; border-radius: 9px; padding: 12px 24px;
  }
  .ask button:hover { background: #1f45c4; }
  .ask button:disabled { background: var(--muted); cursor: wait; }
  .ask:focus-within { box-shadow: 4px 4px 0 var(--blue); border-color: var(--blue); }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
  .chip {
    font: inherit; font-size: .9rem; cursor: pointer; color: var(--ink);
    background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  }
  .chip:hover { border-color: var(--blue); color: var(--blue); }

  #status { min-height: 1.6em; margin: 24px 0 0; color: var(--muted); }
  #status.error { color: var(--err); font-weight: 500; }
  #status.loading::after {
    content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px;
    border: 2px solid var(--line); border-top-color: var(--blue); border-radius: 50%;
    animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-top: 16px; }
  .card h2 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 1.6rem; margin: 0 0 8px; }
  #explanation { margin: 0; font-size: 1.08rem; max-width: 62ch; }

  #controls { font-weight: 500; min-height: 64px; }
  #controls .val { color: var(--blue); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--blue); margin: 8px 0 0; }

  /* fixed-size box so the graph can never collapse or overlap other text */
  .plotwrap { position: relative; width: 100%; height: 420px; overflow: hidden; background: #fff; }
  #plot { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

  details { margin-top: 16px; color: var(--muted); font-size: .92rem; }
  summary { cursor: pointer; font-weight: 500; }
  details ul { margin: 10px 0 0; padding-left: 20px; }
  details li { margin-bottom: 6px; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace; font-size: .82rem; }

  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Concept Calc</h1>
  <p class="lede">Ask a calculus question. Get the idea in plain words, then play with it on a graph.</p>

  <div class="ask">
    <input type="text" id="q" placeholder="Why does the derivative of x^2 equal 2x?" aria-label="Your calculus question" maxlength="300">
    <button id="go">Explain</button>
  </div>
  <div class="chips">
    <button class="chip">Why is the derivative of x^2 equal to 2x?</button>
    <button class="chip">What is the area under x^2 from 0 to 2?</button>
    <button class="chip">What is the slope of sin(x) at 0?</button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <div class="card">
      <h2>The idea</h2>
      <p id="explanation"></p>
      <details id="toolsBox" hidden>
        <summary>How the AI checked its math</summary>
        <ul id="toolsList"></ul>
      </details>
    </div>
    <div class="card">
      <div id="controls"></div>
      <div class="plotwrap"><div id="plot"></div></div>
    </div>
  </section>

  <footer>Explanations are AI-generated, so double-check anything important.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const COLORS = { blue: "#2f5bea", amber: "#e39b12", ink: "#17223b" };

async function ask() {
  const question = $("q").value.trim();
  if (!question) return;
  $("go").disabled = true;
  setStatus("Working it out", "loading");
  $("result").hidden = true;
  $("controls").innerHTML = "";
  $("toolsBox").hidden = true;
  Plotly.purge("plot");
  try {
    const r = await fetch("/api/explain", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    setStatus("", "");
    $("explanation").textContent = data.explanation;
    if (data.tools && data.tools.length) {
      $("toolsList").innerHTML = "";
      data.tools.forEach(t => {
        const li = document.createElement("li");
        li.textContent = t.name + "(" + JSON.stringify(t.args) + ") → " + JSON.stringify(t.result);
        $("toolsList").appendChild(li);
      });
      $("toolsBox").hidden = false;
    }
    $("result").hidden = false;
    drawVisual(data.visual);
    $("result").scrollIntoView({ block: "start" });
  } catch (e) {
    setStatus("Something went wrong: " + e.message + " Try rephrasing your question.", "error");
  } finally {
    $("go").disabled = false;
  }
}

function setStatus(text, cls) {
  $("status").textContent = text;
  $("status").className = cls;
}

$("go").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
document.querySelectorAll(".chip").forEach(c => {
  c.onclick = () => { $("q").value = c.textContent; ask(); };
});

function linspace(a, b, n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(a + (b - a) * i / (n - 1));
  return out;
}

function drawVisual(v) {
  const node = math.compile(v.f);
  const f = x => node.evaluate({ x });
  if (v.type === "tangent") drawTangent(f, v);
  else drawArea(f, v);
}

function yRange(f, v) {
  const ys = linspace(v.xmin, v.xmax, 200).map(f).filter(Number.isFinite);
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo) * 0.15 || 1;
  return [lo - pad, hi + pad];
}

function layout(range, extra) {
  return Object.assign({
    margin: { t: 16, r: 16, b: 40, l: 48 },
    paper_bgcolor: "#ffffff",
    plot_bgcolor: "#ffffff",
    font: { family: "DM Sans, system-ui, sans-serif", color: COLORS.ink },
    xaxis: { gridcolor: "#e4eaf5", zerolinecolor: COLORS.ink },
    yaxis: { range, gridcolor: "#e4eaf5", zerolinecolor: COLORS.ink },
    legend: { orientation: "h", y: -0.18 }
  }, extra || {});
}

const CONFIG = { displayModeBar: false, responsive: true };

function drawTangent(f, v) {
  $("controls").innerHTML =
    'Move the point: x = <span class="val" id="aval"></span>' +
    '<input type="range" id="slider" aria-label="Point on the curve" min="' + v.xmin +
    '" max="' + v.xmax + '" step="0.05" value="' + v.a + '">';
  const xs = linspace(v.xmin, v.xmax, 300);
  const range = yRange(f, v);
  const render = () => {
    const a = parseFloat($("slider").value);
    $("aval").textContent = a.toFixed(2);
    const h = 1e-5;
    const slope = (f(a + h) - f(a - h)) / (2 * h);
    Plotly.react("plot", [
      { x: xs, y: xs.map(f), mode: "lines", name: "f(x)", line: { color: COLORS.blue, width: 3 } },
      { x: xs, y: xs.map(x => f(a) + slope * (x - a)), mode: "lines",
        name: "tangent (slope " + slope.toFixed(2) + ")", line: { color: COLORS.amber, width: 2.5 } },
      { x: [a], y: [f(a)], mode: "markers", name: "point", marker: { color: COLORS.ink, size: 10 } }
    ], layout(range), CONFIG);
  };
  $("slider").oninput = render;
  render();
}

function drawArea(f, v) {
  $("controls").innerHTML =
    'Rectangles: <span class="val" id="nval"></span> &nbsp;|&nbsp; Estimated area: <span class="val" id="sum"></span>' +
    '<input type="range" id="slider" aria-label="Number of rectangles" min="1" max="60" step="1" value="4">';
  const xs = linspace(v.xmin, v.xmax, 300);
  const range = yRange(f, v);
  const render = () => {
    const n = parseInt($("slider").value);
    const dx = (v.b - v.a) / n;
    let sum = 0;
    const shapes = [];
    for (let i = 0; i < n; i++) {
      const x = v.a + i * dx;
      const y = f(x);
      sum += y * dx;
      shapes.push({ type: "rect", x0: x, x1: x + dx, y0: 0, y1: y,
        fillcolor: "rgba(47,91,234,0.18)", line: { color: COLORS.blue, width: 1 } });
    }
    $("nval").textContent = n;
    $("sum").textContent = sum.toFixed(3);
    Plotly.react("plot", [
      { x: xs, y: xs.map(f), mode: "lines", name: "f(x)", line: { color: COLORS.blue, width: 3 } }
    ], layout(range, { shapes }), CONFIG);
  };
  $("slider").oninput = render;
  render();
}
</script>
</body>
</html>
